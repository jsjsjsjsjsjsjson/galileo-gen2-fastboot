# Safe, interactive update-media menu.  The release build installs this at
# /boot/grub/grub.cfg; /EFI/BOOT/grub.cfg is retained as a convenient copy.
set timeout=-1
set default=0

menuentry 'Start UEFI shell for Galileo firmware update' {
  chainloader /EFI/BOOT/BOOTIA32.EFI
  boot
}

menuentry 'Return to UEFI setup' {
  fwsetup
}

menuentry 'Reboot without updating' {
  reboot
}
